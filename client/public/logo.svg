<svg width="240" height="48" viewBox="0 0 240 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <!-- Circle background -->
  <circle cx="24" cy="24" r="24" fill="url(#circleGradient)" />

  <!-- Ladder icon - side view perspective -->
  <g transform="translate(14, 10)">
    <!-- Left rail (closer, thicker) -->
    <rect x="0" y="0" width="4" height="28" rx="2" fill="#ffffff" opacity="0.9" />

    <!-- Right rail (farther, slightly thinner) -->
    <rect x="16" y="0" width="3.5" height="28" rx="1.75" fill="#ffffff" opacity="0.7" />

    <!-- Rungs with perspective -->
    <line x1="4" y1="4" x2="16" y2="4" stroke="#ffffff" stroke-width="2.5" opacity="0.85" stroke-linecap="round" />
    <line x1="4" y1="11" x2="16" y2="11" stroke="#ffffff" stroke-width="2.5" opacity="0.85" stroke-linecap="round" />
    <line x1="4" y1="18" x2="16" y2="18" stroke="#ffffff" stroke-width="2.5" opacity="0.85" stroke-linecap="round" />
    <line x1="4" y1="25" x2="16" y2="25" stroke="#ffffff" stroke-width="2.5" opacity="0.85" stroke-linecap="round" />
  </g>

  <!-- Text -->
  <text x="60" y="32" font-family="Roboto Slab, serif" font-size="20" font-weight="700" fill="url(#textGradient)">Arcade Ladder</text>
</svg>
